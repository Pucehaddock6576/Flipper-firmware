name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [f7]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install ARM toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi scons
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Build firmware
      run: |
        scons -j$(nproc) target=${{ matrix.target }}
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: flipper-firmware-${{ matrix.target }}
        path: |
          flipper_nextgen.bin
          flipper_nextgen.elf
          flipper_nextgen.fuf
          
    - name: Generate build info
      run: |
        echo "Build completed at $(date)" > build_info.txt
        echo "Target: ${{ matrix.target }}" >> build_info.txt
        echo "Commit: ${{ github.sha }}" >> build_info.txt
        
    - name: Upload build info
      uses: actions/upload-artifact@v3
      with:
        name: build-info-${{ matrix.target }}
        path: build_info.txt

  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
        
    - name: Run unit tests
      run: |
        pytest tests/ --cov=core --cov=applications --cov-report=xml
        
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run security scan
      run: |
        # Install security scanning tools
        pip install bandit safety
        
        # Run Python security checks
        bandit -r . -f json -o bandit-report.json || true
        safety check --json --output safety-report.json || true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  release:
    runs-on: ubuntu-latest
    needs: [build, test, security-scan]
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        pattern: flipper-firmware-*
        merge-multiple: true
        
    - name: Create release package
      run: |
        tar -czf flipper-nextgen-${{ github.event.release.tag_name }}.tar.gz \
          flipper_nextgen.bin flipper_nextgen.elf flipper_nextgen.fuf \
          README.md LICENSE docs/
          
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./flipper-nextgen-${{ github.event.release.tag_name }}.tar.gz
        asset_name: flipper-nextgen-${{ github.event.release.tag_name }}.tar.gz
        asset_content_type: application/gzip

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install quality tools
      run: |
        pip install flake8 black isort mypy
        
    - name: Run code quality checks
      run: |
        # Python formatting check
        black --check .
        isort --check-only .
        
        # Linting
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: C code formatting check
      run: |
        # Install clang-format
        sudo apt-get install -y clang-format
        
        # Check C code formatting
        find . -name '*.c' -o -name '*.h' | xargs clang-format --dry-run --Werror

  docker-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
